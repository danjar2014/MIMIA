# Compilation iPhone / iPad de RobotKids sur un Mac de Codemagic (codemagic.io), envoi sur TestFlight.
# Avant le premier lancement, dans Codemagic :
#   1. Ajouter ce dépôt GitHub comme application.
#   2. Team settings > Integrations > Developer Portal : ajouter la clé d'API App Store Connect
#      (App Store Connect > Utilisateurs et accès > Intégrations > Clés, rôle « App Manager »), sous le nom « RobotKids ASC ».
#   3. Lancer le workflow « RobotKids iOS -> TestFlight » (bouton Start new build).
#   4. Créer le groupe de variables « signing » avec la variable secrète CERTIFICATE_PRIVATE_KEY (clé privée RSA PEM).
# Le certificat et le profil de distribution sont ensuite créés automatiquement avec la clé d'API.
workflows:
  ios-testflight:
    name: RobotKids iOS -> TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: RobotKids ASC
    environment:
      flutter: stable   # l'APK Android est compilé avec Flutter 3.47.9 (stable)
      xcode: latest
      groups:
        - signing   # variable secrète CERTIFICATE_PRIVATE_KEY (clé privée de signature, voir ci-dessous)
      vars:
        BUNDLE_ID: com.robotkids.app
    triggering:
      events: []   # lancement à la main uniquement
    scripts:
      - name: Copier l'appli web dans assets/www
        script: bash flutter_app/sync_web.sh
      - name: Paquets Flutter
        script: cd flutter_app && flutter pub get
      - name: Signature (certificat et profil App Store, créés au besoin avec la clé API)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          keychain add-certificates
          xcode-project use-profiles --project flutter_app/ios/Runner.xcodeproj
      - name: Compiler l'ipa
        script: |
          cd flutter_app
          # numéro de build iOS : toujours croissant (66 = dernier versionCode Android au départ)
          flutter build ipa --release \
            --build-number=$((66 + BUILD_NUMBER)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - flutter_app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # Version « simulateur » pour tester dans le navigateur sur appetize.io (sans iPhone, sans compte Apple).
  # Pas de signature ni d'achats (les abonnements ne marchent pas dans un simulateur).
  # Résultat : RobotKids-simulateur.zip dans les fichiers du build, à envoyer sur appetize.io (Upload, plateforme iOS).
  # Envoi automatique possible : ajouter la variable secrète APPETIZE_API_TOKEN (groupe « appetize ») ;
  # après le premier envoi, ajouter aussi APPETIZE_APP_KEY (clé publique de l'appli) pour mettre à jour la même appli.
  ios-simulator:
    name: RobotKids iOS -> simulateur (Appetize)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      groups:
        - appetize
    triggering:
      events: []
    scripts:
      - name: Copier l'appli web dans assets/www
        script: bash flutter_app/sync_web.sh
      - name: Paquets Flutter
        script: cd flutter_app && flutter pub get
      - name: Compiler pour le simulateur
        script: |
          cd flutter_app
          flutter build ios --simulator --debug
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app "$CM_BUILD_DIR/RobotKids-simulateur.zip"
      - name: Envoyer sur Appetize (si le jeton est configuré)
        script: |
          if [ -z "${APPETIZE_API_TOKEN:-}" ]; then echo "Pas de jeton Appetize : télécharger le zip à la main"; exit 0; fi
          url="https://api.appetize.io/v1/apps"; [ -n "${APPETIZE_APP_KEY:-}" ] && url="$url/$APPETIZE_APP_KEY"
          curl -fsS -X POST "$url" -H "X-API-KEY: $APPETIZE_API_TOKEN" \
            -F "file=@$CM_BUILD_DIR/RobotKids-simulateur.zip" -F "platform=ios"
          echo
    artifacts:
      - RobotKids-simulateur.zip
